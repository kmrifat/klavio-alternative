name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mail
          POSTGRES_PASSWORD: mail
          POSTGRES_DB: mail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mail -d mail"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://mail:mail@localhost:5432/mail?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
      - name: Smoke test the binary
        env:
          DATABASE_URL: postgres://mail:mail@localhost:5432/mail?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          go build -o bin/app ./cmd/app
          ./bin/app -mode=migrate
          ./bin/app -mode=all &
          for _ in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/healthz
          curl -fsS localhost:8080/admin/v1/meta
          kill %1 && wait %1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t mail-api:ci api
      - name: Check image size
        run: |
          docker image inspect mail-api:ci --format '{{.Size}}' | awk '{ printf "image size: %.1f MB\n", $1/1048576 }'

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate
